
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Venom Team Discussion Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width:900px;margin:60px auto;padding:24px;">
    <h1>ST. CLAIR VENOM</h1>
    <h2>Private Team Discussion Board</h2>

    <p>
      Welcome to the Venom Team Communication Hub.
    </p>

    <p>
      
<section id="loginSection">
  <h3>Member Login</h3>
  <p>Sign in with your approved Venom account.</p>

  <form id="loginForm">
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      autocomplete="email"
      required
      style="display:block;width:100%;max-width:400px;padding:12px;margin:10px 0;"
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      required
      style="display:block;width:100%;max-width:400px;padding:12px;margin:10px 0;"
    >

    <button type="submit">Sign In</button>
  </form>

  <p id="loginMessage" role="status"></p>
</section>

    </p>

    <a href="index.html">Return to Homepage</a>
  </main>
  
<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL =
    "https://fywijrfymmhctxfvawnv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_SD1rKRGdb7kX0XLTe7ilwg_-enZFxzb";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    loginMessage.textContent = "Signing in...";

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      loginMessage.textContent =
        "Sign-in failed. Check your email and password.";
      return;
    }

    const { data: profile, error: profileError } =
      await supabase
        .from("venom_profiles")
        .select("role, approved")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile?.approved) {
      await supabase.auth.signOut();

      loginMessage.textContent =
        "Your account is awaiting administrator approval.";
      return;
    }

    loginForm.hidden = true;

    loginMessage.textContent =
      "Welcome! You are signed in as " +
      profile.role + ".";

    // Private discussions will be added next.
  });
</script>

</body>
</html>
