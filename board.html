
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Venom Team Discussion Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width:900px;margin:60px auto;padding:24px;">
    <h1>ST. CLAIR VENOM</h1>
    <h2>Private Team Discussion Board</h2>

    <p>
      Welcome to the Venom Team Communication Hub.
    </p>

    <p>
      
<section id="loginSection">
  <h3>Member Login</h3>
  <p>Sign in with your approved Venom account.</p>

  <form id="loginForm">
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      autocomplete="email"
      required
      style="display:block;width:100%;max-width:400px;padding:12px;margin:10px 0;"
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      required
      style="display:block;width:100%;max-width:400px;padding:12px;margin:10px 0;"
    >

    <button type="submit">Sign In</button>
  </form>

  <p id="loginMessage" role="status"></p>
</section>

    </p>

<section id="discussionBoard" hidden>
  <h2>Venom Team Communication Hub</h2>

  <p>
    Select a discussion area to view team messages.
  </p>

  <div style="
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
  ">

    <button type="button" data-board="14u-discussion">
      <h3>14U Team Discussion</h3>
      <p>Messages for the 14U team.</p>
    </button>

    <button type="button" data-board="8u-discussion">
      <h3>8U Team Discussion</h3>
      <p>Messages for the 8U team.</p>
    </button>

    <button type="button" data-board="announcements">
      <h3>Team Announcements</h3>
      <p>Important updates from coaches.</p>
    </button>

    <button type="button" data-board="coaches-only">
      <h3>Coaches Only</h3>
      <p>Private discussions for coaches.</p>
    </button>

  </div>

  <p id="boardMessage" role="status"></p>
</section>

    <a href="index.html">Return to Homepage</a>
  </main>
  
<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL =
    "https://fywijrfymmhctxfvawnv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_SD1rKRGdb7kX0XLTe7ilwg_-enZFxzb";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    loginMessage.textContent = "Signing in...";

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      loginMessage.textContent =
        "Sign-in failed. Check your email and password.";
      return;
    }

    const { data: profile, error: profileError } =
      await supabase
        .from("venom_profiles")
        .select("role, approved")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile?.approved) {
      await supabase.auth.signOut();

      loginMessage.textContent =
        "Your account is awaiting administrator approval.";
      return;
    }

    loginForm.hidden = true;

    loginMessage.textContent =
      "Welcome! You are signed in as " +
      profile.role + ".";

    // Private discussions will be added next.
  });
</script>

</body>
</html>
